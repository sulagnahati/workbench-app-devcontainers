# Metric definitions for the member overview dashboard.
#
# This file is the single place where the dashboard's logic lives. It was drafted from the
# LookML view `patient_gold_latest` (each entry names its LookML source) and then trimmed to the
# fields the dashboard needs. Changing a definition here changes every chart that uses it.
version: 1
title: Member Overview
description: Who our members are, how many are active, and how sign-ups are trending.

source:
  # The table comes from the BQ_TABLES environment variable (first entry).
  alias: patient
  # Copied from the LookML view's sql_table_name filter (excludes a known test record).
  base_filter: "patient.id NOT LIKE '%aa762e77-e12c-4643-ae91-043e153ed139%'"
  lookml: patient_gold_latest

# Groups with fewer members than this are hidden, to avoid exposing individuals.
min_group_size: 11

measures:
  total_members:
    label: Total members
    description: Distinct members (patients) in the table.
    sql: COUNT(DISTINCT patient.id)
    format: number
    lookml: patient_gold_latest.unique_patient_count
  active_members:
    label: Active members
    description: Distinct members whose record is marked active in their program.
    sql: COUNT(DISTINCT IF(COALESCE(patient.is_active, FALSE), patient.id, NULL))
    format: number
    lookml: patient_gold_latest.active_patient_version_count
  active_share:
    label: Active share
    description: Active members divided by total members.
    sql: SAFE_DIVIDE(COUNT(DISTINCT IF(COALESCE(patient.is_active, FALSE), patient.id, NULL)), COUNT(DISTINCT patient.id))
    format: percent
    lookml: derived (active_patient_version_count / unique_patient_count)

dimensions:
  organization:
    label: Organization
    description: Human-readable name of the organization the member belongs to.
    sql: patient.organization_compartment_name
    lookml: patient_gold_latest.organization_compartment_name
  care_program:
    label: Care program
    description: Name of the care program the member is enrolled in.
    sql: patient.care_program_enrolled_healthcareservice_name
    lookml: patient_gold_latest.enrolled_healthcare_service
  state:
    label: State
    description: State from the member's address.
    sql: patient.geographic_state
    lookml: patient_gold_latest.state
  age_band:
    label: Age band
    description: Age grouped into bands. Missing or negative ages are shown as Unknown.
    sql: >-
      CASE
        WHEN patient.age IS NULL OR patient.age < 0 THEN 'Unknown'
        WHEN patient.age < 18 THEN 'Under 18'
        WHEN patient.age <= 29 THEN '18-29'
        WHEN patient.age <= 39 THEN '30-39'
        WHEN patient.age <= 49 THEN '40-49'
        WHEN patient.age <= 59 THEN '50-59'
        WHEN patient.age <= 69 THEN '60-69'
        ELSE '70+'
      END
    order: ["Under 18", "18-29", "30-39", "40-49", "50-59", "60-69", "70+", "Unknown"]
    lookml: patient_gold_latest.age_bucket (bands copied; LookML computes age from a joined view)
  birth_sex:
    label: Sex at birth
    description: The member's assigned sex at birth.
    sql: patient.birth_sex
    lookml: patient_gold_latest.birth_sex
  account_status:
    label: Account status
    description: Status of the member's Verily Me account.
    sql: patient.verily_me_account_status
    lookml: patient_gold_latest.verily_me_account_status
  language:
    label: Preferred language
    description: Inferred preferred language code.
    sql: patient.inferred_preferred_language_code
    lookml: patient_gold_latest.preferred_language
  cohort:
    label: Cohort eligibility
    description: Whether the member belongs to the cardiometabolic cohort group.
    sql: "CASE WHEN patient.group_id_list = 'lhs-cmb-cohort-group' THEN 'Cardiometabolic' ELSE 'None' END"
    lookml: patient_gold_latest.cohort_eligibility
  signup_month:
    label: Sign-up month
    description: Month the member's record was created.
    type: time
    sql: DATE_TRUNC(DATE(patient.created_at), MONTH)
    lookml: patient_gold_latest.created_at_month

# Charts. Every chart is built from the measures and dimensions above.
dashboard:
  kpis: [total_members, active_members, active_share]
  trend:
    dimension: signup_month
    measures: [total_members, active_members]
    series_labels:
      total_members: New members
      active_members: Of those, currently active
  breakdown:
    measures: [total_members, active_members]
    share_measure: active_share
    selectable: [organization, care_program, state, age_band, birth_sex, account_status, language, cohort]
    default: organization
    # Clicking a bar filters the whole dashboard to that value and moves to the next dimension here.
    drill_path: [organization, care_program, state, age_band, birth_sex]

# Example questions this dashboard answers (shown on the page and in the metric documentation).
questions:
  - question: How many members do we have, and how many are active?
    uses: [total_members, active_members, active_share]
  - question: Which organizations have the most members?
    uses: [total_members, organization]
  - question: Which organization or program has the highest share of active members?
    uses: [active_share, organization, care_program]
  - question: Who are our members by age, sex and state?
    uses: [total_members, age_band, birth_sex, state]
  - question: How are sign-ups trending month to month, and how many of those members are still active?
    uses: [total_members, active_members, signup_month]
  - question: For one organization, how does the mix of programs, states and ages look?
    uses: [total_members, organization, care_program, state, age_band]
