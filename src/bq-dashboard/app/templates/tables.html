<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Tables</title>
    <link rel="stylesheet" href="static/verily.css">
    <link rel="stylesheet" href="static/dashboard.css">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 14px; margin-top: 14px; }
        .loading { text-align: center; padding: 40px; color: var(--v-slate); }
        .filters label { margin-right: 16px; display: inline-flex; margin-bottom: 8px; }
        .kpi-inline { font-size: 2em; font-weight: bold; color: var(--v-green-dark); }
    </style>
</head>
<body>
{% with page_title='Tables', page_subtitle='Developer view: counts and distributions for the columns of a table. Aggregates only; no individual rows are shown.', active='tables' %}{% include '_header.html' %}{% endwith %}
<div class="container">
    <div class="card">
        <div class="controls"><label>Table <select id="table-select"></select></label></div>
        <div style="margin-top:12px">Matching rows: <span id="row-count" class="kpi-inline">-</span></div>
        <div id="filters" class="filters" style="margin-top:12px"></div>
    </div>

    <div id="charts" class="grid"></div>

</div>

<script>
// All requests use relative paths (no leading slash) so they work behind the Workbench proxy.
let currentTable = null;
let schema = [];
const CHART_COLUMNS_MAX = 6;

function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function getJSON(path, params) {
    const res = await fetch(`${path}?${params}`);
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    return body;
}

function baseParams() {
    const p = new URLSearchParams({ table: currentTable });
    document.querySelectorAll('select[data-filter]').forEach(s => {
        if (s.value) p.append('filter', `${s.dataset.filter}:${s.value}`);
    });
    return p;
}

async function loadTables() {
    const tables = await getJSON('api/tables', '');
    const sel = document.getElementById('table-select');
    sel.innerHTML = tables.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
    sel.onchange = () => selectTable(sel.value);
    if (tables.length) await selectTable(tables[0]);
}

async function selectTable(table) {
    currentTable = table;
    document.getElementById('filters').innerHTML = '<span class="loading">Loading filters...</span>';
    try {
        schema = await getJSON('api/schema', new URLSearchParams({ table }));
        const filters = await getJSON('api/filters', new URLSearchParams({ table }));
        const box = document.getElementById('filters');
        box.innerHTML = '';
        for (const [col, values] of Object.entries(filters)) {
            const label = document.createElement('label');
            label.textContent = col + ': ';
            const sel = document.createElement('select');
            sel.dataset.filter = col;
            sel.innerHTML = '<option value="">All</option>' +
                values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
            sel.onchange = refresh;
            label.appendChild(sel);
            box.appendChild(label);
        }
    } catch (e) {
        document.getElementById('filters').innerHTML = `<div class="error">${esc(e.message)}</div>`;
        return;
    }
    refresh();
}

function chartCard(id, title) {
    return `<div class="card"><h2>${esc(title)}</h2><div id="${id}" class="loading">Loading...</div></div>`;
}

async function draw(id, fn) {
    const el = document.getElementById(id);
    try {
        await fn(el);
    } catch (e) {
        el.className = 'error';
        el.textContent = e.message;
    }
}

function refresh() {
    const params = baseParams();

    draw('row-count', async el => {
        el.className = 'kpi-inline';
        const s = await getJSON('api/summary', params);
        el.textContent = s.row_count.toLocaleString();
    });

    // One chart per low-cardinality category column, per numeric column, per time column
    const cats = schema.filter(f => f.kind === 'category' && !['id','pendo_visitor_id','identifier_system_value_list','group_id_list'].includes(f.name)).slice(0, CHART_COLUMNS_MAX);
    const nums = schema.filter(f => f.kind === 'numeric').slice(0, 2);
    const times = schema.filter(f => f.kind === 'time').slice(0, 2);

    const charts = document.getElementById('charts');
    charts.innerHTML = '';
    const specs = [
        ...cats.map(f => ({ id: `c-cat-${f.name}`, title: `Rows by ${f.name}`, kind: 'cat', col: f.name })),
        ...nums.map(f => ({ id: `c-num-${f.name}`, title: `Distribution of ${f.name}`, kind: 'num', col: f.name })),
        ...times.map(f => ({ id: `c-time-${f.name}`, title: `Rows per month by ${f.name}`, kind: 'time', col: f.name })),
    ];
    charts.innerHTML = specs.map(s => chartCard(s.id, s.title)).join('');

    for (const s of specs) {
        const p = new URLSearchParams(params);
        p.set('column', s.col);
        draw(s.id, async el => {
            if (s.kind === 'cat') {
                const rows = await getJSON('api/breakdown', p);
                el.className = ''; el.innerHTML = '';
                Plotly.newPlot(el, [{ type: 'bar', x: rows.map(r => r.label ?? '(null)'), y: rows.map(r => r.n), marker: { color: '#36786a' } }],
                    { margin: { t: 10 }, yaxis: { title: 'Rows' } }, { responsive: true });
            } else if (s.kind === 'num') {
                const rows = await getJSON('api/histogram', p);
                el.className = ''; el.innerHTML = '';
                Plotly.newPlot(el, [{ type: 'bar', x: rows.map(r => r.x), y: rows.map(r => r.n), marker: { color: '#569770' } }],
                    { margin: { t: 10 }, xaxis: { title: s.col }, yaxis: { title: 'Rows' } }, { responsive: true });
            } else {
                const rows = await getJSON('api/timeseries', p);
                el.className = ''; el.innerHTML = '';
                Plotly.newPlot(el, [{ type: 'scatter', mode: 'lines', x: rows.map(r => r.month), y: rows.map(r => r.n), line: { color: '#214c43' } }],
                    { margin: { t: 10 }, yaxis: { title: 'Rows' } }, { responsive: true });
            }
        });
    }

}

loadTables().catch(e => {
    document.querySelector('.container').insertAdjacentHTML('beforeend', `<div class="error">${esc(e.message)}</div>`);
});
</script>
</body>
</html>
